name: Docker Image CI

on:
  push:
    branches:
      - Beanverse_cafe_backup
  pull_request:
    branches:
      - Beanverse_cafe_backup
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build --file Docker/Dockerfile --tag bv-cafe:latest .

    - name: Save image
      run: docker save bv-cafe:latest -o bv-cafe.tar

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: bv-cafe-image
        path: bv-cafe.tar


  push:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: bv-cafe-image

    - name: Load image
      run: docker load -i bv-cafe.tar.gz

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Tag image
      run: docker tag bv-cafe:latest ${{ secrets.DOCKER_USERNAME }}/bv-cafe:latest

    - name: Push image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/bv-cafe:latest
      